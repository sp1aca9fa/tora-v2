# The process check: do the pushed commits carry the review trailers their files require?
# A red run here means "review the open task". It has no effect on the server: ops/ci-status.sh
# drops the check run with exactly this job's id. Keep the job's id, and give it no `name:`, since
# GitHub names the check run after it (docs/ci.md, "Process check").
name: Process

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  process-check:
    runs-on: ubuntu-latest
    steps:
      # The whole history, to find where the check starts. The private submodule is not checked
      # out; a bump shows only as a gitlink.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      # An exact path, not a glob: a glob that matches nothing passes with 0 tests.
      - run: node --test ops/process-check.test.mjs
      - name: Compare the pushed commits with their trailers
        # Runs even when a test failed, so a forgotten review in this push is still reported.
        if: ${{ !cancelled() }}
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: node ops/process-check.mjs "$BEFORE" "$AFTER"
